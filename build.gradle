plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases/' }
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org/' }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = targetJavaVersion
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

minecraft {
    accessTransformers {
        file file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"
    localRuntime "maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge"

    compileOnly "maven.modrinth:iris:1.8.8+1.21.1-neoforge"
    localRuntime "maven.modrinth:iris:1.8.8+1.21.1-neoforge"

    compileOnly "maven.modrinth:sodium-extra:mc1.21.1-0.6.0+neoforge"
    compileOnly "maven.modrinth:chunky:1.4.23-neoforge"
    compileOnly "maven.modrinth:vivecraft:1.21.9-1.3.2-neoforge"
    compileOnly "maven.modrinth:lithium:mc1.21.1-0.15.3-neoforge"
}

jarJar.enable()
tasks.jar.finalizedBy tasks.jarJar

project.ext.lwjglVersion = '3.3.3'
dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    compileOnly "org.lwjgl:lwjgl-lmdb"
    compileOnly "org.lwjgl:lwjgl-zstd"

    compileOnly 'com.github.luben:zstd-jni:1.5.6-4'
    jarJar(group: 'com.github.luben', name: 'zstd-jni', version: '[1.5.6-4,2.0.0)')

    compileOnly 'redis.clients:jedis:5.1.0'
    compileOnly 'org.rocksdb:rocksdbjni:10.2.1'
    compileOnly 'org.apache.commons:commons-pool2:2.12.0'
    compileOnly 'org.lz4:lz4-java:1.8.0'
    compileOnly 'org.tukaani:xz:1.10'
    compileOnly 'org.xerial:sqlite-jdbc:3.49.1.0'

    jarJar(group: 'redis.clients', name: 'jedis', version: '[5.1.0,6.0.0)')
    jarJar(group: 'org.rocksdb', name: 'rocksdbjni', version: '[10.2.1,11.0.0)')
    jarJar(group: 'org.apache.commons', name: 'commons-pool2', version: '[2.12.0,3.0.0)')
    jarJar(group: 'org.lz4', name: 'lz4-java', version: '[1.8.0,2.0.0)')
    jarJar(group: 'org.tukaani', name: 'xz', version: '[1.10,2.0)')
    jarJar(group: 'org.xerial', name: 'sqlite-jdbc', version: '[3.49.1.0,4.0.0)')
}

def replaceProperties = [
    mod_version: project.mod_version,
    minecraft_version: project.minecraft_version,
    neo_version: project.neo_version,
    loader_version_range: project.loader_version_range,
]

processResources {
    inputs.properties(replaceProperties)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
